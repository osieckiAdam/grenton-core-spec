name: check
# The gate every pull request passes before it may merge into main.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Declare no installation (CI has no interface archive)
        run: git config grenton.interface none
      - run: python3 tools/suite.py check
      - run: python3 tools/check_versions.py
      - run: python3 tools/check_no_installation_data.py --all
